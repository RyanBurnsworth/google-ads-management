                  items:
                    $ref: "#/components/schemas/ApiErrorResponse"
                  description: "Invalid or Malformed Request"
          '404':
            description: Not Found
            content:
              application/json:
                schema:
                  type: object
                  items:
                    $ref: "#/components/schemas/ApiErrorResponse"
                  description: "The endpoint supplied was not found"
          '500':
            description: Internal Server Error
            content:
              application/json:
                schema:

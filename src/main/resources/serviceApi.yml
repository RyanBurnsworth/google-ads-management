servers:
  - description: AddyAI's service for communicating with Google Ads
    url: http://localhost
info:
  description: API for managing Google Ads accounts
  version: 1.0.0
  title: Google Ads Management Service
  contact:
    - ryanburnsworth@gmail.com
  tags:
    - name: external
      description: The GAMS service endpoints
  paths:
    /api/v1/{customerId}/account/details:
      get:
        tags:
          - external
          - Account
        summary: Fetch account details for a given customerId
        operationId: details
        description:
          Fetch the account details from Google Ads given a customerId
        parameters:
          - in: path
            name: customerId
            description: the id of the customer account in Google Ads
            required: true
            schema:
              type: string
        responses:
          '200':
            description: OK
            content:
              application/json:
                schema:
                  type: object
                  items:
                    $ref: "#/components/schemas/AccountDetails"
          '400':
            description: Bad Request
            content:
              application/json:
                schema:
                  type: object
                  items:
                    $ref: "#/components/schemas/ApiErrorResponse"
                  description: "Invalid or Malformed Request"
          '404':
            description: Not Found
            content:
              application/json:
                schema:
                  type: object
                  items:
                    $ref: "#/components/schemas/ApiErrorResponse"
                  description: "The endpoint supplied was not found"
          '500':
            description: Internal Server Error
            content:
              application/json:
                schema:
                  type: object
                  items:
                    $ref: "#/components/schemas/ApiErrorResponse"
                  description: "An internal server error has occurred"
    /api/v1/{customerId}/campaign/details:
      get:
        tags:
          - external
          - Campaign
        summary: Fetch campaign details for a given customerId
        operationId: details
        description:
          Fetch the campaign details from a Google Ads account given a customerId
        parameters:
          - in: path
            name: customerId
            description: the id of the customer account in Google Ads
            required: true
